[package]
name = "rmq"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sux = "0.15.0"
clap = { version = "4", features = ["derive"] }
needletail = "0.7.4"
libsais = "0.2.0"

[features]
# Exposes `rmq::testing` and the `rmq_conformance!` macro to integration tests.
testing = []

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Self dev-dependency: makes `cargo test`/`cargo bench` build the lib with
# `testing` enabled, without leaking the helpers into normal builds.
rmq = { path = ".", features = ["testing"] }

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true              
split-debuginfo = "packed"
strip = false
[build-dependencies]
cc = "1.4"
